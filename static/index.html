<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interactive OLC Sequence Assembler in Elm</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app"></div>
  <script src="elm.min.js"></script>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const presetParam = params.get('preset');
      const stepParam = params.get('step');
      const flags = {
        preset: presetParam !== null ? parseInt(presetParam, 10) : null,
        step: stepParam !== null ? parseInt(stepParam, 10) : null
      };
      if (window.Elm && window.Elm.Main) {
        window.Elm.Main.init({
          node: document.getElementById('app'),
          flags: flags
        });
      }
    })();
  </script>
</body>
</html>
